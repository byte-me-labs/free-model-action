name: 'Free Model Call'
description: 'Call the free model lanes through the official dsh headless profile and return the answer as a JSON result'
author: 'free-model-action'
branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  lane:
    description: 'auto, kilo, or opencode. auto uses the plugin combo: Kilo first, then OpenCode.'
    required: false
    default: 'auto'
  model:
    description: 'Explicit model id or combo id. Overrides lane.'
    required: false
    default: ''
  prompt:
    description: 'Prompt text. Use prompt-file for large inputs such as diffs.'
    required: false
    default: ''
  prompt-file:
    description: 'Path to a UTF-8 prompt file. Takes precedence over prompt.'
    required: false
    default: ''
  system:
    description: 'Optional instruction prepended to the task.'
    required: false
    default: ''
  system-file:
    description: 'Path to a UTF-8 instruction file. Takes precedence over system.'
    required: false
    default: ''
  max-output-tokens:
    description: 'Output token cap written to the plugin defaultMaxTokens setting.'
    required: false
    default: '1200'
  max-input-chars:
    description: 'Prompt character cap applied after secret redaction.'
    required: false
    default: '60000'
  timeout-ms:
    description: 'Whole-run timeout in milliseconds.'
    required: false
    default: '180000'
  permission-mode:
    description: 'dsh permission preset: read-only, workspace-write, or danger-full-access.'
    required: false
    default: 'read-only'
  soft-fail:
    description: 'Exit 0 when the run fails. Default true so an AI step does not break CI.'
    required: false
    default: 'true'
  dsh-version:
    description: 'npm version or dist-tag of @deepseek-ai/dsh. Default latest.'
    required: false
    default: 'latest'
  plugin-tag:
    description: 'dsh-our-free-model release tag, or latest for the newest stable release.'
    required: false
    default: 'latest'
  setup-node:
    description: 'Install Node 24 with actions/setup-node. dsh requires Node 24.9 or later.'
    required: false
    default: 'true'
  install-bun:
    description: 'Install Bun with oven-sh/setup-bun. The OpenCode lane requires Bun.'
    required: false
    default: 'true'

outputs:
  ok:
    description: 'true when dsh completed with non-empty answer text.'
    value: ${{ steps.call.outputs.ok }}
  lane:
    description: 'Lane that was requested: auto, kilo, or opencode.'
    value: ${{ steps.call.outputs.lane }}
  model:
    description: 'Model or combo id handed to the plugin.'
    value: ${{ steps.call.outputs.model }}
  text:
    description: 'Answer text.'
    value: ${{ steps.call.outputs.text }}
  finish:
    description: 'dsh terminal reason kind: completed, error, or aborted.'
    value: ${{ steps.call.outputs.finish }}
  result-file:
    description: 'Absolute path to the result JSON.'
    value: ${{ steps.call.outputs.result-file }}
  comment-file:
    description: 'Absolute path to a sanitized comment body when ok=true; empty otherwise.'
    value: ${{ steps.emit.outputs.comment-file }}
  plugin-tag:
    description: 'Resolved dsh-our-free-model release tag.'
    value: ${{ steps.plugin.outputs.tag }}

runs:
  using: composite
  steps:
    - id: node
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - id: bun
      if: ${{ inputs.install-bun == 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 'latest'

    - name: Install dsh
      shell: bash
      env:
        DSH_VERSION: ${{ inputs.dsh-version }}
      run: |
        set -euo pipefail
        if [[ ! "$DSH_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::dsh-version '$DSH_VERSION' is not a valid npm version or dist-tag"
          exit 1
        fi
        stamp="${RUNNER_TEMP:-/tmp}/free-model-action-dsh-${DSH_VERSION}"
        if [ -f "$stamp" ] && command -v dsh >/dev/null 2>&1; then
          echo "dsh is already installed in this job ($DSH_VERSION)"
          exit 0
        fi
        npm install --global --no-audit --no-fund \
          "@deepseek-ai/dsh@${DSH_VERSION}" pnpm@latest
        touch "$stamp"
        dsh --version

    - name: Install the dsh-our-free-model plugin
      id: plugin
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.plugin-tag }}
        DSH_HOME: ${{ runner.temp }}/free-model-action/dsh
      run: |
        set -euo pipefail
        tag="$INPUT_TAG"
        if [ "$tag" = "latest" ]; then
          tag=$(node "$GITHUB_ACTION_PATH/scripts/resolve-release.mjs" --repo Ebony-Vinyl/dsh-our-free-model)
        fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::plugin-tag '$tag' is not a stable vX.Y.Z release"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

        mkdir -p "$DSH_HOME"
        plugin_dir="$RUNNER_TEMP/free-model-action-plugin"
        rm -rf "$plugin_dir"
        mkdir -p "$plugin_dir"
        gh release download "$tag" \
          --repo Ebony-Vinyl/dsh-our-free-model \
          --pattern 'dsh-our-free-model-*.tgz' \
          --dir "$plugin_dir"
        tarball=$(find "$plugin_dir" -maxdepth 1 -name '*.tgz' -print -quit)
        if [ -z "$tarball" ]; then
          echo "::error::release $tag does not contain a .tgz asset"
          exit 1
        fi
        dsh plugin --profile headless add "$tarball"

    - id: call
      shell: bash
      env:
        INPUT_LANE: ${{ inputs.lane }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        INPUT_SYSTEM: ${{ inputs.system }}
        INPUT_SYSTEM_FILE: ${{ inputs.system-file }}
        INPUT_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        INPUT_MAX_INPUT_CHARS: ${{ inputs.max-input-chars }}
        INPUT_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        INPUT_PERMISSION_MODE: ${{ inputs.permission-mode }}
        INPUT_SOFT_FAIL: ${{ inputs.soft-fail }}
        INPUT_INSTALL_BUN: ${{ inputs.install-bun }}
        DSH_HOME: ${{ runner.temp }}/free-model-action/dsh
      run: |
        set -uo pipefail
        umask 077
        out_dir="${RUNNER_TEMP:-/tmp}/free-model-action"
        mkdir -p "$out_dir"
        cleanup() { rm -f "$out_dir/prompt.txt" "$out_dir/system.txt"; }
        trap cleanup EXIT

        if [ "$INPUT_INSTALL_BUN" = "true" ]; then
          bun_path=$(command -v bun || true)
          if [ -n "$bun_path" ]; then
            export OUR_FREE_MODEL_BUN="$bun_path"
          fi
        fi

        args=(
          --lane "$INPUT_LANE"
          --out "$out_dir/result.json"
          --events "$out_dir/events.ndjson"
          --max-output-tokens "$INPUT_MAX_OUTPUT_TOKENS"
          --max-input-chars "$INPUT_MAX_INPUT_CHARS"
          --timeout-ms "$INPUT_TIMEOUT_MS"
          --permission-mode "$INPUT_PERMISSION_MODE"
        )

        if [ -n "$INPUT_MODEL" ]; then
          args+=(--model "$INPUT_MODEL")
        fi

        if [ -n "$INPUT_PROMPT_FILE" ]; then
          args+=(--prompt-file "$INPUT_PROMPT_FILE")
        else
          printf '%s' "$INPUT_PROMPT" > "$out_dir/prompt.txt"
          args+=(--prompt-file "$out_dir/prompt.txt")
        fi

        if [ -n "$INPUT_SYSTEM_FILE" ]; then
          args+=(--system-file "$INPUT_SYSTEM_FILE")
        elif [ -n "$INPUT_SYSTEM" ]; then
          printf '%s' "$INPUT_SYSTEM" > "$out_dir/system.txt"
          args+=(--system-file "$out_dir/system.txt")
        fi

        if [ "$INPUT_SOFT_FAIL" = "true" ]; then
          args+=(--soft-fail)
        fi

        set +e
        node "$GITHUB_ACTION_PATH/scripts/dsh-call.mjs" "${args[@]}"
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # Emit outputs and the job summary even when the call failed, so the
        # caller can inspect `ok` and the dsh reason instead of a bare red X.
        node "$GITHUB_ACTION_PATH/scripts/emit-result.mjs" \
          --result "$out_dir/result.json" \
          --summary \
          --comment-file "$out_dir/comment.md" || true

        exit 0

    - id: emit
      shell: bash
      run: |
        out_dir="${RUNNER_TEMP:-/tmp}/free-model-action"
        if [ -f "$out_dir/comment.md" ]; then
          echo "comment-file=$out_dir/comment.md" >> "$GITHUB_OUTPUT"
        else
          echo "comment-file=" >> "$GITHUB_OUTPUT"
        fi

    - name: Propagate the dsh exit code
      shell: bash
      env:
        CALL_EXIT_CODE: ${{ steps.call.outputs.exit-code }}
      run: exit "${CALL_EXIT_CODE:-2}"
